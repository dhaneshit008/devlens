[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens"
version = "0.4.0"
description = "Evidence-backed repository digital twin and change intelligence"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src"]

[[tool.mypy.overrides]]
module = ["tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
