name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devlens_test
          POSTGRES_USER: devlens
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devlens -d devlens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check services tests scripts && ruff format --check services tests scripts
      - run: mypy
      - run: pytest -q
        env:
          DEVLENS_TEST_DATABASE_URL: postgresql+psycopg://devlens@localhost:5432/devlens_test
      - run: python -m build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: apps/web/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for healthy API and web
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:8080/api/v1/health && curl --fail http://localhost:8080; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down
